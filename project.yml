name: Nova
options:
  bundleIdPrefix: com.manas
  deploymentTarget:
    iOS: "16.0"
targets:
  Nova:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Nova
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.manas.nova
            CFBundleURLSchemes: [nova]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Nova utilise la localisation uniquement pour rester active en arrière-plan pendant un scénario. Ta position n'est ni enregistrée ni envoyée."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manas.nova
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
