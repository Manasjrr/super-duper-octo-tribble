name: Compiler l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen et ldid
        run: brew install xcodegen ldid

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signe à l'installation)
        run: |
          xcodebuild \
            -project Nova.xcodeproj \
            -scheme Nova \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer les fichiers .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app Payload/
          # Version de secours, sans autorisation spéciale (icône de l'app sur les notifs)
          zip -qr Nova-sans-icones.ipa Payload
          # Version principale : on déclare l'autorisation « Communication Notifications »
          # pour que SideStore la reprenne en signant (icônes personnalisées sur les notifs)
          ldid -SSources/Nova.entitlements Payload/Nova.app/Nova
          zip -qr Nova.ipa Payload

      - name: Publier le .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: |
            Nova.ipa
            Nova-sans-icones.ipa
