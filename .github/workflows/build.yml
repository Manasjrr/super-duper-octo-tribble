name: Compiler l'app

on:
  push:
    branches: [main]
    # Les pages des applis expéditrices (docs/) n'ont pas besoin d'un nouveau build de l'app
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signe à l'installation)
        run: |
          xcodebuild \
            -project Nova.xcodeproj \
            -scheme Nova \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app Payload/
          zip -qr Nova.ipa Payload

      - name: Publier le .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: Nova.ipa
