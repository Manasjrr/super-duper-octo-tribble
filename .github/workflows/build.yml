name: Compiler l'app

on:
  push:
    branches: [main]
    # Les pages des applis expéditrices (docs/) n'ont pas besoin d'un nouveau build de l'app,
    # sauf leurs icônes, qui sont aussi affichées dans Nova
    paths: ['**', '!docs/**', 'docs/p/*/icon-180.png']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reprendre les icônes des applis expéditrices
        # Nova affiche la même icône que celle installée sur l'écran d'accueil (docs/p/<appli>/icon-180.png)
        run: |
          for icon in docs/p/*/icon-180.png; do
            slot=$(basename "$(dirname "$icon")")
            dir="Sources/Assets.xcassets/Preview-Persona-$slot.imageset"
            mkdir -p "$dir"
            cp "$icon" "$dir/preview.png"
            printf '{"images":[{"filename":"preview.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}' > "$dir/Contents.json"
          done

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature, SideStore signe à l'installation)
        run: |
          xcodebuild \
            -project Nova.xcodeproj \
            -scheme Nova \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app Payload/
          zip -qr Nova.ipa Payload

      - name: Publier le .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: Nova.ipa
